<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>three.js 渲染探针</title>
<script type="importmap">
{
  "imports": {
    "three": "./three.module.js"
  }
}
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; color: #fff; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 8px; top: 8px; right: 8px; z-index: 10;
    background: rgba(0,0,0,.6); border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
    padding: 8px 10px; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .k { color: #8fe; flex: none; }
  .v { color: #fff; text-align: right; word-break: break-all; }
  .ok { color: #6f6; } .bad { color: #f66; }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="row"><span class="k">判定</span><span class="v">应看到 深蓝底 + 橙色立方体</span></div>
    <div class="row"><span class="k">WebGL</span><span class="v" id="st-ver">…</span></div>
    <div class="row"><span class="k">GPU</span><span class="v" id="st-gpu">…</span></div>
    <div class="row"><span class="k">FPS</span><span class="v" id="st-fps">…</span></div>
    <div class="row"><span class="k">draw</span><span class="v" id="st-draw">…</span></div>
    <div class="row"><span class="k">glErr</span><span class="v" id="st-glerr">…</span></div>
    <div class="row"><span class="k">err</span><span class="v" id="st-err">-</span></div>
    <div class="row"><span class="k">UA</span><span class="v" id="st-ua">…</span></div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
